<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Tradutor — Cubos de Desera</title>
  <meta name="description" content="Tradutor simples do português para a língua de Cubos de Desera em ABC normal." />
  <link rel="stylesheet" href="translator.css" />
</head>
<body>
  <main class="page">
    <section class="translator">
      <div class="brand">CUBOS DE DESERA</div>
      <h1>Tradutor</h1>
      <p class="subtitle">Português → língua de Cubos de Desera em ABC normal</p>

      <label for="sourceInput">Escreva aqui</label>
      <textarea id="sourceInput" rows="5" autocomplete="off" spellcheck="true" placeholder="Ex.: destino"></textarea>

      <div class="arrow">↓</div>

      <label for="resultOutput">Tradução</label>
      <div class="output-wrap">
        <textarea id="resultOutput" rows="5" readonly placeholder="weran"></textarea>
        <button id="copyBtn" type="button">Copiar</button>
      </div>

      <p id="status" class="status">Digite algo para traduzir.</p>
    </section>
  </main>

  <script src="translator.js"></script>
</body>
</html>
