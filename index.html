<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Tradutor — Cubos de Desera</title>
<meta name="description" content="Tradutor Português ↔ Desera em ABC normal.">
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0f131b;--panel2:#0a0d13;--line:#222a37;--text:#f6f8fb;--muted:#7f8999;--soft:#aeb8c8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;padding:14px;background:radial-gradient(circle at 50% -20%,rgba(91,116,167,.19),transparent 42%),var(--bg)}
.shell{width:min(760px,100%);margin:0 auto;padding:clamp(14px,5vh,54px) 0 28px}
.brand{display:flex;align-items:center;gap:10px;margin:0 5px 14px;color:#adb7c7;font-size:11px;font-weight:900;letter-spacing:.16em}.cube{width:12px;height:12px;border:1px solid #e6ebf3;transform:rotate(45deg);box-shadow:0 0 22px rgba(230,235,243,.18)}
.card{border:1px solid rgba(255,255,255,.08);border-radius:28px;background:linear-gradient(180deg,#111722,#0b0f16);box-shadow:0 28px 80px rgba(0,0,0,.42);overflow:hidden}.hero{padding:27px clamp(18px,5vw,34px) 22px;border-bottom:1px solid rgba(255,255,255,.055)}h1{margin:0;font-size:clamp(39px,9vw,66px);line-height:.92;letter-spacing:-.06em}.hero p{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.hero strong{color:#e6ebf3}
.work{padding:clamp(16px,4vw,28px)}.direction{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:8px 8px 8px 13px;border:1px solid rgba(255,255,255,.065);border-radius:15px;background:#090d13}.direction span{font-size:12px;font-weight:900;color:#c2cad7}.swap{width:39px;height:39px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:#171d27;color:#f1f4f8;font-size:18px;font-weight:900;cursor:pointer}.swap:active{transform:scale(.96)}
.labelrow{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.label{color:#9aa5b5;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.count{color:#596474;font-size:10px}
textarea{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:19px;background:var(--panel2);color:var(--text);padding:17px;font:650 18px/1.5 Inter,system-ui;outline:none;transition:.16s}textarea:focus{border-color:#66748c;box-shadow:0 0 0 4px rgba(102,116,140,.10)}textarea::placeholder{color:#475160}
.actions{display:flex;gap:9px;margin:11px 0 19px}.btn{border:0;border-radius:14px;padding:13px 16px;font:850 13px Inter,system-ui;cursor:pointer}.primary{flex:1;background:#f5f7fa;color:#0a0d12}.secondary{background:#171d26;color:#aeb7c5;border:1px solid rgba(255,255,255,.06)}.btn:active{transform:scale(.99)}
.output{position:relative;min-height:126px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#121823,#0b1017);padding:58px 17px 17px 17px}.result{font-size:clamp(27px,6.8vw,43px);font-weight:930;line-height:1.3;letter-spacing:-.035em;white-space:pre-wrap;word-break:break-word}.result.empty{font-size:16px;font-weight:650;letter-spacing:0;color:#485363}.output-tools{position:absolute;right:11px;top:11px;display:flex;gap:7px}.tool{border:1px solid rgba(255,255,255,.07);border-radius:11px;background:#1b2230;color:#dfe5ee;padding:8px 10px;font:850 10px Inter,system-ui;cursor:pointer}.tool:active{transform:scale(.97)}.info{min-height:18px;margin:9px 3px 0;color:#6e798a;font-size:11px;line-height:1.45}
.examples{display:flex;gap:7px;overflow:auto;margin-top:19px;padding-bottom:2px;scrollbar-width:none}.examples::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid rgba(255,255,255,.065);border-radius:999px;background:#0b0f15;color:#838e9e;padding:8px 11px;font:800 10px Inter,system-ui;cursor:pointer}.chip b{color:#e8edf5}.foot{text-align:center;margin-top:13px;color:#414b59;font-size:9px;font-weight:800;letter-spacing:.08em}
@media(max-width:560px){body{padding:10px}.shell{padding-top:6px}.card{border-radius:23px}.hero{padding:22px 17px 19px}.work{padding:15px}.actions{position:sticky;bottom:7px;z-index:3}.primary{box-shadow:0 12px 28px rgba(0,0,0,.35)}textarea{min-height:106px}.output{min-height:112px;padding-top:56px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><span class="cube"></span>CUBOS DE DESERA</div>
  <section class="card">
    <header class="hero">
      <h1>Tradutor</h1>
      <p>Português ↔ <strong>língua de Desera</strong>. Só escrever e traduzir.</p>
    </header>
    <div class="work">
      <div class="direction">
        <span id="directionText">Português → Desera</span>
        <button class="swap" id="swap" type="button" aria-label="Inverter tradução">↔</button>
      </div>

      <div class="labelrow"><span class="label" id="fromLabel">Português</span><span class="count" id="count">0</span></div>
      <textarea id="input" placeholder="Ex.: destino" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>

      <div class="actions">
        <button class="btn secondary" id="clear" type="button">Limpar</button>
        <button class="btn primary" id="translate" type="button">Traduzir</button>
      </div>

      <div class="labelrow"><span class="label" id="toLabel">Desera — ABC normal</span></div>
      <div class="output">
        <div class="output-tools">
          <button class="tool" id="listen" type="button">🔊 Ouvir</button>
          <button class="tool" id="copy" type="button">Copiar</button>
        </div>
        <div class="result empty" id="result">A tradução aparece aqui.</div>
      </div>
      <div class="info" id="info"></div>

      <div class="examples">
        <button class="chip" data-word="destino">destino → <b>weran</b></button>
        <button class="chip" data-word="presença">presença → <b>korun</b></button>
        <button class="chip" data-word="vontade">vontade → <b>uran</b></button>
        <button class="chip" data-word="identidade">identidade → <b>serang</b></button>
      </div>
    </div>
  </section>
  <div class="foot">TRADUTOR DESERA · V11</div>
</main>
<script src="translator-core.js?v=11"></script>
<script src="pronunciation.js?v=11"></script>
<script src="translator-ui.js?v=11"></script>
</body>
</html>
