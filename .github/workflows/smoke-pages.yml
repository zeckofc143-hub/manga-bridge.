name: Smoke test Desera Translator Pages

on:
  workflow_run:
    workflows: ["Deploy MangaBridge to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live translator
        shell: bash
        run: |
          set -e
          SITE='https://zeckofc143-hub.github.io/manga-bridge./?v=desera3'
          for i in $(seq 1 12); do
            CODE=$(curl -L -sS -o /tmp/site -w '%{http_code}' --max-time 25 "$SITE" || true)
            echo "attempt=$i http=$CODE size=$(wc -c </tmp/site 2>/dev/null || echo 0)"
            if [ "$CODE" = "200" ] && grep -q '"destino":"weran"' /tmp/site && grep -q 'function generateWord' /tmp/site; then
              echo 'DESERA_TRANSLATOR_LIVE_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'Live translator did not update in time'
          exit 1
