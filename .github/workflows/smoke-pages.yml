name: Smoke test Desera Translator Pages

on:
  workflow_run:
    workflows: ["Deploy MangaBridge to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live translator behavior
        shell: bash
        run: |
          set -e
          BASE='https://zeckofc143-hub.github.io/manga-bridge./'
          for i in $(seq 1 18); do
            SITE=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 25 "${BASE}?v=9" || true)
            CORE=$(curl -L -sS -o /tmp/translator-core.js -w '%{http_code}' --max-time 25 "${BASE}translator-core.js?v=9" || true)
            UI=$(curl -L -sS -o /tmp/translator-ui.js -w '%{http_code}' --max-time 25 "${BASE}translator-ui.js?v=9" || true)
            echo "attempt=$i site=$SITE core=$CORE ui=$UI"

            if [ "$SITE" = "200" ] && [ "$CORE" = "200" ] && [ "$UI" = "200" ] \
              && grep -q 'translator-core.js?v=9' /tmp/site.html \
              && grep -q 'translator-ui.js?v=9' /tmp/site.html; then
              if node - <<'NODE'
          const T=require('/tmp/translator-core.js');
          const assert=require('node:assert/strict');

          assert.equal(T.translate('destino').output,'weran');
          assert.equal(T.translate('presença').output,'korun');
          assert.equal(T.reverse('weran').output,'destino');
          assert.equal(T.reverse('korun').output,'presença');

          for(const word of ['liberdade','entendendo','agora','porra','universo','magia']){
            const out=T.translate(word).output;
            assert.equal(T.normalizeWord(T.reverse(out).output),T.normalizeWord(word));
          }

          const phrase='eu gosto de liberdade?';
          const encoded=T.translate(phrase).output;
          assert.equal(T.normalize(T.reverse(encoded).output),T.normalize(phrase));
          assert.equal(T.reverse('sezhel tolrodu yavas gewes???').output,'ta entendendo agora porra???');

          console.log('DESERA_V9_LIVE_LOGIC_OK',encoded);
          NODE
              then
                echo 'DESERA_TRANSLATOR_LIVE_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Live translator did not pass behavior checks in time'
          exit 1
