name: Smoke test Desera Translator Pages

on:
  workflow_run:
    workflows: ["Deploy MangaBridge to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live translator behavior
        shell: bash
        run: |
          set -e
          BASE='https://zeckofc143-hub.github.io/manga-bridge./'
          for i in $(seq 1 18); do
            SITE=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 25 "${BASE}?v=8" || true)
            CORE=$(curl -L -sS -o /tmp/translator-core.js -w '%{http_code}' --max-time 25 "${BASE}translator-core.js?v=8" || true)
            UI=$(curl -L -sS -o /tmp/translator-ui.js -w '%{http_code}' --max-time 25 "${BASE}translator-ui.js?v=8" || true)
            echo "attempt=$i site=$SITE core=$CORE ui=$UI"

            if [ "$SITE" = "200" ] && [ "$CORE" = "200" ] && [ "$UI" = "200" ] \
              && grep -q 'translator-core.js?v=8' /tmp/site.html \
              && grep -q 'translator-ui.js?v=8' /tmp/site.html \
              && grep -q 'id="swap"' /tmp/site.html; then
              if node - <<'NODE'
          const T=require('/tmp/translator-core.js');
          const assert=require('node:assert/strict');

          assert.equal(T.translate('destino').output,'weran');
          assert.equal(T.translate('presença').output,'korun');
          assert.equal(T.reverse('weran').output,'destino');
          assert.equal(T.reverse('korun').output,'presença');

          const liberdade=T.translate('liberdade');
          const index={[T.normalizeDesera(liberdade.output)]:['liberdade']};
          assert.equal(T.reverse(liberdade.output,index).output,'liberdade');

          const phrase=T.translate('eu gosto de liberdade?');
          const phraseIndex={[T.normalize(phrase.output)]:'eu gosto de liberdade?'};
          assert.equal(T.reverse(phrase.output,{},phraseIndex).output,'eu gosto de liberdade?');

          console.log('DESERA_V8_LIVE_LOGIC_OK',liberdade.output,phrase.output);
          NODE
              then
                echo 'DESERA_TRANSLATOR_LIVE_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Live translator did not pass behavior checks in time'
          exit 1
