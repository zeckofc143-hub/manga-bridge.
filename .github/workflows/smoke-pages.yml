name: Smoke test Desera Translator Pages

on:
  workflow_run:
    workflows: ["Deploy MangaBridge to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live translator behavior
        shell: bash
        run: |
          set -e
          BASE='https://zeckofc143-hub.github.io/manga-bridge./'
          for i in $(seq 1 18); do
            SITE=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 25 "${BASE}?v=11" || true)
            CORE=$(curl -L -sS -o /tmp/translator-core.js -w '%{http_code}' --max-time 25 "${BASE}translator-core.js?v=11" || true)
            PRON=$(curl -L -sS -o /tmp/pronunciation.js -w '%{http_code}' --max-time 25 "${BASE}pronunciation.js?v=11" || true)
            UI=$(curl -L -sS -o /tmp/translator-ui.js -w '%{http_code}' --max-time 25 "${BASE}translator-ui.js?v=11" || true)
            echo "attempt=$i site=$SITE core=$CORE pron=$PRON ui=$UI"

            if [ "$SITE" = "200" ] && [ "$CORE" = "200" ] && [ "$PRON" = "200" ] && [ "$UI" = "200" ] \
              && grep -q 'translator-core.js?v=11' /tmp/site.html \
              && grep -q 'pronunciation.js?v=11' /tmp/site.html \
              && grep -q 'translator-ui.js?v=11' /tmp/site.html \
              && grep -q 'id="listen"' /tmp/site.html; then
              if node - <<'NODE'
          const T=require('/tmp/translator-core.js');
          const P=require('/tmp/pronunciation.js');
          const assert=require('node:assert/strict');

          assert.equal(T.translate('destino').output,'weran');
          assert.equal(T.translate('presença').output,'korun');
          assert.equal(T.reverse('weran').output,'destino');
          assert.equal(T.reverse('korun').output,'presença');

          assert.equal(T.translate('eu gosto de liberdade?').output,'ia duspu ti lovirteti?');
          assert.equal(T.reverse('ia duspu ti lovirteti?').output,'eu gosto de liberdade?');

          assert.equal(P.romanSourceWord('weran'),'wëran');
          assert.equal(P.wordToSpeech('weran'),'uâran');
          assert.equal(P.wordToSpeech('tishen'),'tixen');
          assert.equal(P.toSpeechText('weran korun'),'uâran korun');

          for(const word of ['liberdade','entendendo','agora','porra','universo','magia','você','criação','coração']){
            const out=T.translate(word).output;
            assert.equal(T.reverse(out).output,word,word+' round-trip');
          }

          assert.equal(T.reverse('sezhel tolrodu yavas gewes???').output,'ta entendendo agora porra???');
          console.log('DESERA_V11_LIVE_LOGIC_OK');
          NODE
              then
                echo 'DESERA_TRANSLATOR_LIVE_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Live translator did not pass behavior checks in time'
          exit 1
