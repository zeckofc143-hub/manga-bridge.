name: Smoke test MangaBridge Pages

on:
  workflow_run:
    workflows: ["Deploy MangaBridge to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site, chapter, OCR, JavaScript and first image
        shell: bash
        run: |
          set -e
          SITE='https://zeckofc143-hub.github.io/manga-bridge./'
          UUID='51429dea-7169-4913-b5d6-a4ee00329eb7'
          DATA="${SITE}data/${UUID}.json"
          OCR="${SITE}data/${UUID}.ocr.json"
          IMAGE='https://cmdxd98sb0x3yprd.mangadex.network/data/1ec2d035196aec17521017ecf2f9ebe4/1-5c5dc473b828c896640b99fc963bbcacc15408d2e8de5367879d2adc1eb644bf.png'

          wait_200() {
            NAME="$1"; URL="$2"
            for i in $(seq 1 12); do
              CODE=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$URL" || true)
              echo "$NAME attempt=$i http=$CODE size=$(wc -c </tmp/body 2>/dev/null || echo 0)"
              if [ "$CODE" = "200" ]; then return 0; fi
              sleep 5
            done
            echo "$NAME failed"
            return 1
          }

          wait_200 site "$SITE"
          wait_200 data "$DATA"
          wait_200 ocr "$OCR"
          wait_200 app "${SITE}app.js?v=15"
          wait_200 ocr_ui "${SITE}ocr-ui.js?v=15"
          wait_200 typer_ui "${SITE}typer-ui.js?v=15"

          curl -L -sS --max-time 25 "$DATA" -o /tmp/chapter.json
          node -e "const d=require('/tmp/chapter.json'); if(d.chapterId!=='$UUID'||d.pages.length!==23) process.exit(1); console.log('DATA_OK',d.mangaTitle,d.pages.length)"

          curl -L -sS --max-time 25 "$OCR" -o /tmp/ocr.json
          node -e "const d=require('/tmp/ocr.json'); if(d.chapterId!=='$UUID'||d.totalRegions<1||d.pages.length!==23) process.exit(1); console.log('OCR_OK',d.engine,d.totalRegions,d.pages.length)"

          curl -L -sS --max-time 25 "${SITE}app.js?v=15" -o /tmp/app.js
          curl -L -sS --max-time 25 "${SITE}ocr-ui.js?v=15" -o /tmp/ocr-ui.js
          curl -L -sS --max-time 25 "${SITE}typer-ui.js?v=15" -o /tmp/typer-ui.js
          node --check /tmp/app.js
          node --check /tmp/ocr-ui.js
          node --check /tmp/typer-ui.js
          grep -q 'mangaBridgeTyper' /tmp/typer-ui.js
          echo 'JS_OK app + ocr-ui + typer-ui'

          CODE=$(curl -L -sS -o /tmp/page1 -w '%{http_code}' --max-time 30 -H 'Referer: https://zeckofc143-hub.github.io/manga-bridge./' "$IMAGE" || true)
          SIZE=$(wc -c </tmp/page1 2>/dev/null || echo 0)
          echo "image http=$CODE size=$SIZE"
          test "$CODE" = "200"
          test "$SIZE" -gt 10000
          echo 'SMOKE_OK'
