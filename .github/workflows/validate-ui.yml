name: Validate Desera Translator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check translator-core.js
          node --check pronunciation.js
          node --check translator-ui.js
      - name: Run translator tests
        run: node tests/translator.test.js
      - name: Verify page hooks
        shell: bash
        run: |
          set -e
          grep -q '<title>Tradutor — Cubos de Desera</title>' index.html
          grep -q 'translator-core.js?v=11' index.html
          grep -q 'pronunciation.js?v=11' index.html
          grep -q 'translator-ui.js?v=11' index.html
          grep -q 'id="listen"' index.html
          grep -q 'id="swap"' index.html
          grep -q 'id="input"' index.html
          grep -q 'id="result"' index.html
          echo 'DESERA_TRANSLATOR_V11_UI_OK'
