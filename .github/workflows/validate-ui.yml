name: Validate Desera Translator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify translator structure
        shell: bash
        run: |
          set -e
          grep -q '<title>Tradutor — Cubos de Desera</title>' index.html
          grep -q '"destino":"weran"' index.html
          grep -q 'function generateWord' index.html
          grep -q 'function translateText' index.html
          grep -q 'id="input"' index.html
          grep -q 'id="result"' index.html
          echo 'TRANSLATOR_UI_OK'
