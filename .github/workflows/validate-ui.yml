name: Validate Desera Translator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check translator-core.js
          node --check grammar-v12.js
          node --check grammar-v12-reverse.js
          node --check pronunciation.js
          node --check translator-ui.js
      - name: Run final translator tests
        run: node tests/translator-v12.test.js
      - name: Verify page hooks
        shell: bash
        run: |
          set -e
          grep -q '<title>Tradutor — Cubos de Desera</title>' index.html
          grep -q 'translator-core.js?v=12' index.html
          grep -q 'grammar-v12.js?v=12' index.html
          grep -q 'grammar-v12-reverse.js?v=12' index.html
          grep -q 'pronunciation.js?v=12' index.html
          grep -q 'translator-ui.js?v=12' index.html
          grep -q 'id="listen"' index.html
          grep -q 'id="swap"' index.html
          grep -q 'GRAMÁTICA RELACIONAL' index.html
          echo 'DESERA_TRANSLATOR_V12_UI_OK'
