name: Cache requested MangaDex chapter

on:
  issues:
    types: [opened]
  push:
    branches: ["main"]
    paths:
      - "scripts/ocr-chapter.mjs"
      - ".github/workflows/cache-chapter.yml"

permissions:
  contents: write
  issues: write

jobs:
  cache:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'MangaBridge:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve UUID
        id: chapter
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TEST_UUID: 51429dea-7169-4913-b5d6-a4ee00329eb7
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            UUID="$TEST_UUID"
          else
            UUID=$(printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" | grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' | head -1 || true)
          fi
          if [ -z "$UUID" ]; then
            echo "Nenhum UUID válido encontrado."
            exit 1
          fi
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "UUID=$UUID"

      - name: Fetch chapter from MangaDex
        run: node scripts/cache-chapter.mjs "${{ steps.chapter.outputs.uuid }}"

      - name: Install OCR languages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-jpn \
            tesseract-ocr-kor \
            tesseract-ocr-chi-sim \
            tesseract-ocr-chi-tra

      - name: Detect text regions with Tesseract
        run: node scripts/ocr-chapter.mjs "${{ steps.chapter.outputs.uuid }}"

      - name: Commit cached chapter and OCR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/${{ steps.chapter.outputs.uuid }}.json" \
            "data/${{ steps.chapter.outputs.uuid }}.ocr.json"
          if git diff --cached --quiet; then
            echo "Cache e OCR já estavam atualizados."
          else
            git commit -m "Cache and OCR MangaDex chapter ${{ steps.chapter.outputs.uuid }}"
            git push
          fi

      - name: Mark request complete
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Capítulo \`${{ steps.chapter.outputs.uuid }}\` preparado com OCR automático. Volte ao MangaBridge e toque em **Verificar novamente**.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
