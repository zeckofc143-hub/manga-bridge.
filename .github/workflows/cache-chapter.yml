name: Cache requested MangaDex chapter

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: manga-bridge-cache
  cancel-in-progress: false

jobs:
  cache:
    if: startsWith(github.event.issue.title, 'MangaBridge:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract UUID
        id: chapter
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          UUID=$(printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" | grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' | head -1 || true)
          if [ -z "$UUID" ]; then
            echo "Nenhum UUID válido encontrado."
            exit 1
          fi
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "UUID=$UUID"

      - name: Fetch chapter from MangaDex
        run: node scripts/cache-chapter.mjs "${{ steps.chapter.outputs.uuid }}"

      - name: Install OCR languages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-jpn \
            tesseract-ocr-kor \
            tesseract-ocr-chi-sim \
            tesseract-ocr-chi-tra

      - name: Detect text regions with Tesseract
        run: node scripts/ocr-chapter.mjs "${{ steps.chapter.outputs.uuid }}"

      - name: Commit cached chapter and OCR
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/${{ steps.chapter.outputs.uuid }}.json" \
            "data/${{ steps.chapter.outputs.uuid }}.ocr.json"

          if git diff --cached --quiet; then
            echo "Cache e OCR já estavam atualizados."
            exit 0
          fi

          git commit -m "Cache and OCR MangaDex chapter ${{ steps.chapter.outputs.uuid }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Mark request complete
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Capítulo \`${{ steps.chapter.outputs.uuid }}\` preparado com OCR filtrado. Volte ao MangaBridge e toque em **Verificar novamente**.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
